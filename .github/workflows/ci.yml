name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: instacrane
          POSTGRES_PASSWORD: instacrane
          POSTGRES_DB: instacrane
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod

      - name: MinIO
        run: |
          docker run -d --name instacrane-minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioaccess \
            -e MINIO_ROOT_PASSWORD=miniosecret \
            cgr.dev/chainguard/minio:latest server /data
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:9000/minio/health/live && exit 0
            sleep 1
          done
          echo "MinIO n'a pas répondu" >&2
          exit 1

      - name: Migrations et tests
        working-directory: server
        env:
          DATABASE_URL: postgres://instacrane:instacrane@localhost:5432/instacrane?sslmode=disable
          STORAGE_ENDPOINT: http://127.0.0.1:9000
          STORAGE_BUCKET: instacrane-media
          STORAGE_ACCESS_KEY: minioaccess
          STORAGE_SECRET_KEY: miniosecret
        run: go test ./...

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Image
        run: docker build -f server/Dockerfile .

  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Dépendances
        working-directory: client
        run: npm ci --legacy-peer-deps

      - name: Configuration et tests
        working-directory: client
        env:
          EXPO_NO_TELEMETRY: "1"
          CI: "1"
        run: npm test

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Validate
        working-directory: infra
        run: terraform init -backend=false && terraform validate

  deploy:
    runs-on: ubuntu-latest
    needs: [test, image, client, terraform]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    concurrency:
      group: deploy
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - name: Secrets de déploiement
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          missing=0
          for name in DEPLOY_SSH_KEY DEPLOY_USER DEPLOY_HOST DEPLOY_PATH; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name absent"
              missing=1
            fi
          done
          exit $missing

      - name: SSH
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
          log-public-key: false

      - name: Hôte connu
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Déploiement
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          rsync -avz --delete \
            --exclude .env \
            --exclude '.env.*' \
            --exclude secrets \
            --exclude node_modules \
            --exclude client/node_modules \
            --exclude .git \
            --exclude .expo \
            --exclude infra/.terraform \
            --exclude '*.tfstate' \
            --exclude '*.tfvars' \
            ./ "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}"
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" "cd ${DEPLOY_PATH} && docker-compose up -d --build"
