name: Lint & Tests

on:
  push:
    paths:
      - "backend/**"
  pull_request:
    paths:
      - "backend/**"

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: instacrane
          POSTGRES_PASSWORD: instacrane
          POSTGRES_DB: instacrane
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install ruff black pytest pytest-asyncio httpx

      - name: Lint (ruff)
        working-directory: backend
        run: ruff check .

      - name: Format (black)
        working-directory: backend
        run: black --check .

      - name: Tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://instacrane:instacrane@localhost:5432/instacrane
          JWT_SECRET_KEY: test-secret
          S3_ENDPOINT_URL: http://localhost:9000
          S3_ACCESS_KEY: test
          S3_SECRET_KEY: test
        run: pytest -v
