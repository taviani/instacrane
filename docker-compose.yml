services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: instacrane
      POSTGRES_PASSWORD: instacrane
      POSTGRES_DB: instacrane
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioaccess
      MINIO_ROOT_PASSWORD: miniosecret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  createbucket:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 minioaccess miniosecret;
      mc mb local/instacrane-media --ignore-existing;
      mc anonymous set download local/instacrane-media;
      exit 0;
      "

volumes:
  pgdata:
  miniodata:
